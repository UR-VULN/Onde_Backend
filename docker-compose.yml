# 로컬 개발용 전체 스택: MariaDB + Redis + MinIO + api-module(8080) + admin-module(8081)
#   cp .env.example .env  →  값 채우기  →  docker compose up --build -d
# 비밀값은 전부 루트의 .env 에서 읽습니다. 프론트엔드(Onde_Frontend)와 시드 데이터는 포함하지 않습니다.
services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: onde
      MARIADB_USER: ${DB_USERNAME:-onde}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2022-05-08T23-50-31Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  api:
    build:
      context: .
      args:
        MODULE: api-module
    env_file: .env
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/onde
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AWS_S3_ENDPOINT: http://minio:9000
    ports:
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  admin:
    build:
      context: .
      args:
        MODULE: admin-module
    env_file: .env
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/onde
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AWS_S3_ENDPOINT: http://minio:9000
    ports:
      - "8081:8081"   # admin-module 은 server.port=8081 로 기동
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mariadb-data:
  minio-data:
